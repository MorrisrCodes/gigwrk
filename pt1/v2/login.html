<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in – Luna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-auth">
  <header class="navbar">
    <div class="navbar-left"><a href="index.html" class="logo">Luna</a></div>
    <nav class="navbar-right">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse-gigs.html" class="nav-link">Find Help</a>
      <a href="create-gig.html" class="nav-link">Post Help</a>
    </nav>
  </header>

  <main class="main">
    <section class="section auth-card">
      <h1>Log in</h1>
      <p class="subtitle">Demo only. No accounts yet.</p>

      <form class="auth-form">
        <label class="form-field">
          <span class="label">Email</span>
          <input type="email" placeholder="you@email.com" required />
        </label>
        <label class="form-field">
          <span class="label">Password</span>
          <input type="password" placeholder="••••••••" required />
        </label>
        <div class="form-actions">
          <a href="helper-profile.html" class="btn primary">Log in as Helper</a>
          <a href="helpee-dashboard.html" class="btn secondary">Log in as Helpee</a>
        </div>
      </form>

      <p class="form-hint">
        New here? <a href="signup-helper.html" class="mini-link">Join as Helper</a> or
        <a href="signup-helpee.html" class="mini-link">Join as Helpee</a>.
      </p>
    </section>
  </main>

  <footer class="footer"><p>© 2025 Luna</p></footer>
</body>
</html>
