<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Gig – GigMatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-create">
  <header class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="logo">GigMatch</a>
    </div>
    <nav class="navbar-right">
      <a href="index.html" class="nav-link">Home</a>
      <a href="create-gig.html" class="nav-link active">Post a Gig</a>
      <a href="browse-gigs.html" class="nav-link">Browse Gigs</a>
    </nav>
  </header>

  <main class="main">
    <section class="section">
      <h1>Create a new gig</h1>
      <p class="subtitle">
        This form is only UI for now. Later it will save to a backend and trigger
        matching for gig workers.
      </p>

      <form class="form" id="createGigForm">
        <div class="form-grid">
          <label class="form-field">
            <span class="label">Gig title</span>
            <input
              type="text"
              name="title"
              placeholder="e.g., Weekend event photographer"
              required
            />
          </label>

          <label class="form-field">
            <span class="label">Location</span>
            <input
              type="text"
              name="location"
              placeholder="Remote, Atlanta, GA, etc."
              required
            />
          </label>

          <label class="form-field">
            <span class="label">Schedule / date</span>
            <input
              type="text"
              name="schedule"
              placeholder="e.g., Saturdays 10am–4pm or Dec 5, 6pm–11pm"
              required
            />
          </label>

          <label class="form-field">
            <span class="label">Pay range (optional)</span>
            <div class="pay-row">
              <input
                type="number"
                name="payMin"
                placeholder="Min ($)"
                min="0"
              />
              <span class="pay-separator">to</span>
              <input
                type="number"
                name="payMax"
                placeholder="Max ($)"
                min="0"
              />
            </div>
          </label>
        </div>

        <label class="form-field">
          <span class="label">Gig description</span>
          <textarea
            name="description"
            rows="4"
            placeholder="Describe the tasks, responsibilities, and expectations."
            required
          ></textarea>
        </label>

        <label class="form-field">
          <span class="label">Skills / experience</span>
          <textarea
            name="skills"
            rows="3"
            placeholder="e.g., 1+ year experience, customer-facing, basic Excel, etc."
          ></textarea>
        </label>

        <label class="form-field">
          <span class="label">Personality preferences</span>
          <textarea
            name="personality"
            rows="3"
            placeholder="e.g., outgoing, patient, detail-oriented, calm under pressure."
          ></textarea>
        </label>

        <label class="form-field">
          <span class="label">Availability requirements</span>
          <textarea
            name="availability"
            rows="2"
            placeholder="e.g., weekends only, must commit for 3 months, etc."
          ></textarea>
        </label>

        <label class="form-field">
          <span class="label">Additional notes</span>
          <textarea
            name="notes"
            rows="2"
            placeholder="Anything else they should know before accepting."
          ></textarea>
        </label>

        <div class="form-actions">
          <button class="btn primary" type="submit">
            Save gig (demo only)
          </button>
        </div>

        <p class="form-hint">
          Later: this will create a gig in the database and trigger auto-matching.
        </p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 GigMatch – Prototype UI</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
