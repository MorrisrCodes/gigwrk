<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Become a Gig Runner – Gigga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<script src="script.js" defer></script>

<body class="sleek-app page-auth">
  <header class="landing-nav">
  <a href="index.html" class="landing-logo">Gigga</a>

  <!-- ADD THIS hamburger button -->
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

  <!-- your EXISTING desktop links stay exactly the same -->
  <nav class="landing-links">
    <a href="index.html" class="landing-link">Home</a>
    <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
    <a href="create-gig.html" class="landing-link">Post a Gig</a>
    <a href="login.html" class="landing-link">Log in</a>
  </nav>

  <!-- ADD THIS mobile panel (copy same links; no new ones) -->
  <nav class="mobile-panel" aria-hidden="true">
    <a href="index.html" class="landing-link">Home</a>
    <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
    <a href="create-gig.html" class="landing-link">Post a Gig</a>
    <a href="login.html" class="landing-link">Log in</a>
  </nav>
</header>


  <main class="sleek-main auth-main">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>

    <section class="auth-shell">
      <header class="auth-header">
        <p class="sleek-eyebrow">GIG RUNNER</p>
        <h1 class="sleek-title">Create your account</h1>
        <p class="sleek-subtitle">
          Build your profile once — gigs will come to you when matching launches.
        </p>
      </header>

      <form
        class="auth-form"
        onsubmit="event.preventDefault(); location.href='helper-profile.html';"
      >
        <label class="sleek-field full">
          <span>Full name</span>
          <input type="text" placeholder="Your name" required />
        </label>

        <label class="sleek-field full">
          <span>Email</span>
          <input type="email" placeholder="you@email.com" required />
        </label>

        <label class="sleek-field full">
          <span>Password</span>
          <input type="password" placeholder="Create a password" required />
        </label>

        <div class="auth-actions">
          <button class="cta cta-primary full" type="submit">
            Continue
          </button>
          <a href="login.html" class="cta cta-ghost full">
            I already have an account
          </a>
        </div>

        <div class="auth-footer">
          <p>
            Want to post gigs instead?
            <a href="signup-helpee.html">Become a Gig Host</a>.
          </p>
        </div>
      </form>
    </section>
  </main>

  <footer class="landing-footer">© 2025 Gigga</footer>
</body>
</html>
