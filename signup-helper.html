<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join as Helper – Luna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-auth">
  <header class="navbar">
    <div class="navbar-left"><a href="index.html" class="logo">Luna</a></div>
    <nav class="navbar-right">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse-gigs.html" class="nav-link">Find Help</a>
      <a href="create-gig.html" class="nav-link">Post Help</a>
    </nav>
  </header>

  <main class="main">
    <section class="section auth-card">
      <h1>Create Helper account</h1>
      <p class="subtitle">UI only. This routes to your Helper profile builder.</p>

      <form class="auth-form" onsubmit="event.preventDefault(); location.href='helper-profile.html';">
        <label class="form-field">
          <span class="label">Full name</span>
          <input type="text" required />
        </label>
        <label class="form-field">
          <span class="label">Email</span>
          <input type="email" required />
        </label>
        <label class="form-field">
          <span class="label">Password</span>
          <input type="password" required />
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit">Continue</button>
          <a href="login.html" class="btn secondary">I already have an account</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer"><p>© 2025 Luna</p></footer>
</body>
</html>
