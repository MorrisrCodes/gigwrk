<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gig Runner Profile – Gigga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../content/styles.css" />
  <link rel="icon" href="../content/favicon.ico" />
</head>

<body class="sleek-app page-profile">

  <!-- Sleek header -->
  <header class="landing-nav">
    <a href="../index.html" class="landing-logo">Gigga</a>

    <!-- Hamburger (mobile only) -->
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <!-- Desktop links -->
    <nav class="landing-links">
      <a href="../index.html" class="landing-link">Home</a>
      <a href="../browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="../host/create-gig.html" class="landing-link">Post a Gig</a>
      <a href="../login.html" class="landing-link">Log in</a>
    </nav>

    <!-- Mobile dropdown -->
    <nav class="mobile-panel" aria-hidden="true">
      <a href="../index.html" class="landing-link">Home</a>
      <a href="../browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="../host/create-gig.html" class="landing-link">Post a Gig</a>
      <a href="../login.html" class="landing-link">Log in</a>
    </nav>
  </header>

  <main class="sleek-main auth-main">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>

    <section class="sleek-shell auth-shell">
      <header class="sleek-header">
        <div>
          <p class="sleek-eyebrow">GIG RUNNER</p>
          <h1 class="sleek-title">Your profile</h1>
          <p class="sleek-subtitle">
            Set up your worker onboarding: skills, photo, pricing, availability, and location.
          </p>
        </div>
        <div class="sleek-pill">Demo</div>
      </header>

      <form
        class="sleek-form"
        onsubmit="event.preventDefault(); location.href='../browse-gigs.html';"
      >
        <div class="sleek-grid">
          <!-- Basic info -->
          <label class="sleek-field">
            <span>Full name</span>
            <input type="text" placeholder="Your name" required />
          </label>

          <label class="sleek-field">
            <span>Email</span>
            <input type="email" placeholder="you@email.com" required />
          </label>

          <label class="sleek-field">
            <span>Phone</span>
            <input type="tel" placeholder="(555) 555-5555" />
          </label>

          <!-- Profile photo -->
          <label class="sleek-field">
            <span>Profile photo</span>
            <input type="file" id="runnerPhoto" accept="image/*" />
            <div style="margin-top:0.6rem;">
              <img
                id="runnerPhotoPreview"
                alt="Profile preview"
                style="display:none;width:72px;height:72px;border-radius:999px;object-fit:cover;border:1px solid rgba(255,255,255,0.14);"
              />
            </div>
            <p class="sleek-footnote">
              This will power your public worker profile later.
            </p>
          </label>

          <!-- Location + permissions -->
          <label class="sleek-field">
            <span>Home base / location</span>
            <input
              type="text"
              id="runnerLocation"
              placeholder="City, neighborhood or coordinates"
            />
            <button
              type="button"
              class="cta cta-ghost small"
              id="runnerUseLocation"
              style="margin-top:0.4rem;"
            >
              Use my location (demo)
            </button>
            <p class="sleek-footnote" id="runnerLocationStatus">
              We’ll only use this in the browser in this MVP — no storage yet.
            </p>
          </label>

          <!-- Availability -->
          <label class="sleek-field">
            <span>Availability</span>
            <input
              type="text"
              placeholder="Weeknights, weekends, flexible…"
            />
          </label>

          <!-- Skills / tasks -->
          <label class="sleek-field full">
            <span>Skills / tasks you want to run</span>
            <div class="task-grid">
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="moving" />
                <span>Moving help</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="lifting" />
                <span>Lifting furniture</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="setup" />
                <span>Setup / breakdown</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="yard" />
                <span>Yard work</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="cleanouts" />
                <span>Cleanouts</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="errands" />
                <span>Errands</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="seasonal" />
                <span>Seasonal tasks</span>
              </label>
              <label class="task-pill">
                <input type="checkbox" name="runnerTasks" value="other" />
                <span>Other tasks</span>
              </label>
            </div>
            <input
              type="text"
              style="margin-top:0.5rem;"
              placeholder="Custom tasks (e.g., tech setup, photography, bike courier)"
            />
            <p class="sleek-footnote">
              Matching will later use this to decide which gigs to surface.
            </p>
          </label>

          <!-- Pricing -->
          <label class="sleek-field full">
            <span>Base price / price range</span>
            <div class="sleek-pay">
              <input type="number" min="0" placeholder="Min $ / hr" />
              <input type="number" min="0" placeholder="Max $ / hr (optional)" />
            </div>
            <p class="sleek-footnote">
              Simple hourly range for now. Stripe + payouts will hook into this later.
            </p>
          </label>

          <!-- Short bio -->
          <label class="sleek-field full">
            <span>Short bio</span>
            <textarea rows="3" placeholder="Tell hosts a bit about you."></textarea>
          </label>

          <!-- Preferences / notes -->
          <label class="sleek-field full">
            <span>Preferences / notes</span>
            <textarea
              rows="3"
              placeholder="Types of gigs you prefer, or things you want to avoid."
            ></textarea>
          </label>
        </div>

        <div class="sleek-actions">
          <button class="cta cta-primary" type="submit">Save profile</button>
          <a href="../browse-gigs.html" class="cta cta-ghost">Cancel</a>
        </div>

        <p class="sleek-footnote">
          Demo only — this shapes the worker onboarding but doesn’t persist yet.
        </p>
      </form>
    </section>
  </main>

  <footer class="landing-footer">© 2025 Gigga</footer>

  <script src="../script.js" defer></script>

  <!-- Page-specific JS for photo + location -->
  <script>
    (function () {
      // photo preview
      const fileInput = document.getElementById("runnerPhoto");
      const preview = document.getElementById("runnerPhotoPreview");

      if (fileInput && preview) {
        fileInput.addEventListener("change", () => {
          const file = fileInput.files[0];
          if (!file) {
            preview.style.display = "none";
            preview.removeAttribute("src");
            return;
          }
          const url = URL.createObjectURL(file);
          preview.src = url;
          preview.style.display = "block";
        });
      }

      // geolocation (demo)
      const btn = document.getElementById("runnerUseLocation");
      const input = document.getElementById("runnerLocation");
      const status = document.getElementById("runnerLocationStatus");

      if (btn && input && status) {
        btn.addEventListener("click", () => {
          if (!navigator.geolocation) {
            status.textContent = "Geolocation is not supported in this browser.";
            return;
          }

          status.textContent = "Requesting location from your browser…";

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              input.value = latitude.toFixed(5) + ", " + longitude.toFixed(5) + " (demo)";
              status.textContent = "Location captured (demo only, not stored).";
            },
            () => {
              status.textContent =
                "Couldn’t access your location. You may have denied permission.";
            },
            { timeout: 10000 }
          );
        });
      }
    })();
  </script>
</body>
</html>
