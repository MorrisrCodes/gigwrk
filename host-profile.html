<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gig Host Profile – Gigga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="sleek-app page-profile">

  <header class="landing-nav">
    <a href="index.html" class="landing-logo">Gigga</a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav class="landing-links">
      <a href="index.html" class="landing-link">Home</a>
      <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="create-gig.html" class="landing-link">Post a Gig</a>
      <a href="login.html" class="landing-link">Log in</a>
    </nav>

    <nav class="mobile-panel" aria-hidden="true">
      <a href="index.html" class="landing-link">Home</a>
      <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="create-gig.html" class="landing-link">Post a Gig</a>
      <a href="login.html" class="landing-link">Log in</a>
    </nav>
  </header>

  <main class="sleek-main auth-main">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>

    <section class="sleek-shell auth-shell">
      <header class="sleek-header">
        <div>
          <p class="sleek-eyebrow">GIG HOST</p>
          <h1 class="sleek-title">Your profile</h1>
          <p class="sleek-subtitle">
            This is UI-only for now — just shaping the flow.
          </p>
        </div>
        <div class="sleek-pill">Demo</div>
      </header>

      <form class="sleek-form" onsubmit="event.preventDefault(); location.href='host-dashboard.html';">
        <div class="sleek-grid">

          <label class="sleek-field">
            <span>Full name</span>
            <input type="text" placeholder="Your name" required />
          </label>

          <label class="sleek-field">
            <span>Email</span>
            <input type="email" placeholder="you@email.com" required />
          </label>

          <label class="sleek-field full">
            <span>Location</span>
            <input type="text" placeholder="City, state or neighborhood" />
          </label>

          <label class="sleek-field full">
            <span>What kind of help do you usually need?</span>
            <textarea rows="4" placeholder="Moving help, errands, admin, pet care, etc."></textarea>
          </label>

          <label class="sleek-field full">
            <span>Notes / preferences</span>
            <textarea rows="3" placeholder="Anything helpers should know?"></textarea>
          </label>
        </div>

        <div class="sleek-actions">
          <button class="cta cta-primary" type="submit">Save profile</button>
          <a href="host-dashboard.html" class="cta cta-ghost">Cancel</a>
        </div>
      </form>

    </section>
  </main>

  <footer class="landing-footer">© 2025 Gigga</footer>
  <script src="script.js" defer></script>
</body>
</html>
