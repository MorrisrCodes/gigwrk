<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gig Runner Profile – Gigga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="sleek-app page-profile">

  <!-- Sleek header -->
  <header class="landing-nav">
    <a href="index.html" class="landing-logo">Gigga</a>

    <!-- Hamburger (mobile only) -->
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <!-- Desktop links (same as your other pages) -->
    <nav class="landing-links">
      <a href="index.html" class="landing-link">Home</a>
      <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="create-gig.html" class="landing-link">Post a Gig</a>
      <a href="login.html" class="landing-link">Log in</a>
    </nav>

    <!-- Mobile dropdown -->
    <nav class="mobile-panel" aria-hidden="true">
      <a href="index.html" class="landing-link">Home</a>
      <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="create-gig.html" class="landing-link">Post a Gig</a>
      <a href="login.html" class="landing-link">Log in</a>
    </nav>
  </header>

  <main class="sleek-main auth-main">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>

    <section class="sleek-shell auth-shell">
      <header class="sleek-header">
        <div>
          <p class="sleek-eyebrow">GIG RUNNER</p>
          <h1 class="sleek-title">Your profile</h1>
          <p class="sleek-subtitle">
            Set your info once — matching will use this later.
          </p>
        </div>
        <div class="sleek-pill">Demo</div>
      </header>

      <form
        class="sleek-form"
        onsubmit="event.preventDefault(); location.href='browse-gigs.html';"
      >
        <div class="sleek-grid">

          <label class="sleek-field">
            <span>Full name</span>
            <input type="text" placeholder="Your name" required />
          </label>

          <label class="sleek-field">
            <span>Email</span>
            <input type="email" placeholder="you@email.com" required />
          </label>

          <label class="sleek-field">
            <span>Location</span>
            <input type="text" placeholder="City, state" />
          </label>

          <label class="sleek-field">
            <span>Availability</span>
            <input type="text" placeholder="Weekends, evenings, flexible…" />
          </label>

          <label class="sleek-field full">
            <span>Skills you want to run</span>
            <input type="text" placeholder="moving, admin, deliveries, events, pet care…" />
          </label>

          <label class="sleek-field full">
            <span>Short bio</span>
            <textarea rows="4" placeholder="Tell hosts a bit about you."></textarea>
          </label>

          <label class="sleek-field full">
            <span>Preferences / notes</span>
            <textarea rows="3" placeholder="Anything we should match you with or avoid?"></textarea>
          </label>

        </div>

        <div class="sleek-actions">
          <button class="cta cta-primary" type="submit">Save profile</button>
          <a href="browse-gigs.html" class="cta cta-ghost">Cancel</a>
        </div>

        <p class="sleek-footnote">
          Demo only — profile doesn’t save yet.
        </p>
      </form>
    </section>
  </main>

  <footer class="landing-footer
