<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Helper Profile – Luna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-create">
  <header class="navbar">
    <div class="navbar-left"><a href="index.html" class="logo">Luna</a></div>
    <nav class="navbar-right">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse-gigs.html" class="nav-link active">Find Help</a>
      <a href="create-gig.html" class="nav-link">Post Help</a>
      <div class="nav-divider"></div>
      <a href="admin.html" class="nav-link nav-admin">Admin</a>
    </nav>
  </header>

  <main class="main">
    <section class="section">
      <h1>Helper profile builder</h1>
      <p class="subtitle">UI only. This will feed the auto-matching engine later.</p>

      <form class="form" id="helperProfileForm">
        <div class="form-grid">
          <label class="form-field">
            <span class="label">Preferred pay</span>
            <input type="text" name="payPref" placeholder="e.g., $20/hr minimum" />
          </label>
          <label class="form-field">
            <span class="label">Availability</span>
            <input type="text" name="availabilityPref" placeholder="Weekends, evenings, etc." />
          </label>
          <label class="form-field">
            <span class="label">Skills</span>
            <input type="text" name="skillsPref" placeholder="Moving, admin, photography..." />
          </label>
          <label class="form-field">
            <span class="label">Personality traits</span>
            <input type="text" name="personalityPref" placeholder="Friendly, calm, detail-oriented..." />
          </label>
        </div>

        <label class="form-field">
          <span class="label">Bio</span>
          <textarea name="bio" rows="4" placeholder="Tell Helpees about you."></textarea>
        </label>

        <div class="form-actions">
          <button class="btn primary" type="submit">Save profile (demo)</button>
          <a href="browse-gigs.html" class="btn secondary">Back to gigs</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer"><p>© 2025 Luna</p></footer>
  <script src="script.js"></script>
</body>
</html>
