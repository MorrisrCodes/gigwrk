<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in – Gigga</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="sleek-app page-auth">
  <header class="landing-nav">
    <a href="index.html" class="landing-logo">Gigga</a>
    <nav class="landing-links">
      <a href="index.html" class="landing-link">Home</a>
      <a href="browse-gigs.html" class="landing-link">Browse Gigs</a>
      <a href="create-gig.html" class="landing-link">Post a Gig</a>
      <a href="login.html" class="landing-link active">Log in</a>
    </nav>
  </header>

  <main class="sleek-main auth-main">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-grid"></div>

    <section class="auth-shell">
      <header class="auth-header">
        <p class="sleek-eyebrow">WELCOME BACK</p>
        <h1 class="sleek-title">Log in</h1>
        <p class="sleek-subtitle">Demo only for now.</p>
      </header>

      <form class="auth-form" onsubmit="event.preventDefault();">
        <label class="sleek-field full">
          <span>Email</span>
          <input type="email" placeholder="you@email.com" required />
        </label>

        <label class="sleek-field full">
          <span>Password</span>
          <input type="password" placeholder="••••••••" required />
        </label>

        <div class="auth-actions">
          <a href="helper-profile.html" class="cta cta-primary full">
            Log in as Gig Runner
          </a>
          <a href="helpee-dashboard.html" class="cta cta-ghost full">
            Log in as Gig Host
          </a>
        </div>

        <div class="auth-footer">
          <p>
            New here?
            <a href="signup-helpee.html">Become a Gig Host</a>
            or
            <a href="signup-helper.html">Become a Gig Runner</a>.
          </p>
        </div>
      </form>
    </section>
  </main>

  <footer class="landing-footer">© 2025 Gigga</footer>
</body>
</html>
